<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COMD Career Tools</title>
<meta name="description" content="Three ways to plan your COMD path at City Tech: start from your classes, start from a job, or read about where the degree takes you.">
<style>
/* One URL for the three COMD career pages. The tab bar sits on top; the selected page fills the rest of the window
   and scrolls on its own, so each page's sticky panels, jump links and section highlights keep working.
   This page holds no course or career data. Everything comes from the three pages it loads. */
@font-face{font-family:'Archivo';src:url('fonts/Archivo-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Archivo';src:url('fonts/Archivo-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
@font-face{font-family:'Work Sans';src:url('fonts/WorkSans-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
:root{
  --bg:#F4F3EF; --surface:#FFFFFF; --ink:#16161A; --muted:#5C5A55; --line:#D8D5CC; --hl:#FFE45C; --on-hl:#16161A;
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --head:'Work Sans','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#131315; --surface:#1D1D21; --ink:#EDEBE6; --muted:#A3A09A; --line:#34343A; --hl:#E9C93A; --on-hl:#131315; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#131315; --surface:#1D1D21; --ink:#EDEBE6; --muted:#A3A09A; --line:#34343A; --hl:#E9C93A; --on-hl:#131315; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--display);display:flex;flex-direction:column;
  height:100vh;height:100dvh;overflow:hidden}

header{flex:none;background:var(--surface);border-bottom:1.5px solid var(--ink);
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.bar{max-width:1180px;margin:0 auto;display:flex;align-items:stretch;gap:24px}
.brand{flex:none;align-self:center;font-family:var(--head);font-weight:700;font-size:13px;letter-spacing:.08em;
  text-transform:uppercase;line-height:1.15;padding:12px 0}
.brand span{display:block;color:var(--muted);font-family:var(--display);font-weight:400;letter-spacing:.04em}

[role=tablist]{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;min-width:0}
[role=tab]{appearance:none;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer;text-align:left;
  padding:12px 14px 10px;border-bottom:5px solid transparent;min-height:44px;min-width:0}
[role=tab] b{display:block;font-family:var(--head);font-weight:700;font-size:17px;line-height:1.15}
[role=tab] small{display:block;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
[role=tab]:hover{background:var(--bg)}
[role=tab][aria-selected=true]{border-bottom-color:var(--ink)}
[role=tab][aria-selected=true] b{background:var(--hl);color:var(--on-hl);box-shadow:0 0 0 3px var(--hl);display:inline;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
[role=tab][aria-selected=true] small{margin-top:6px}
[role=tab]:focus-visible{outline:3px solid var(--ink);outline-offset:-3px}

main{flex:1;position:relative;min-height:0}
main iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg)}
main iframe[hidden]{display:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;pointer-events:none}

@media (max-width:960px){ .bar{gap:0} .brand{display:none} }
@media (max-width:760px){
  [role=tab]{padding:10px 8px 8px;text-align:center}
  [role=tab] b{font-size:14px}
  [role=tab] small{font-size:10px;letter-spacing:.04em}
}
@media (max-width:480px){ [role=tab] small{display:none} [role=tab]{padding:12px 6px 9px} }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">COMD Career Tools<span>City Tech</span></div>
    <div role="tablist" aria-label="Career tools">
      <button role="tab" id="tab-map" aria-controls="panel-map" data-key="map" data-src="career-map.html">
        <b>Start with a Track</b><small>Degree Map</small>
      </button>
      <button role="tab" id="tab-pathfinder" aria-controls="panel-pathfinder" data-key="pathfinder" data-src="index.html">
        <b>From Tracks to Jobs</b><small>Path Finder</small>
      </button>
      <button role="tab" id="tab-magazine" aria-controls="panel-magazine" data-key="magazine" data-src="career-magazine.html">
        <b>Exploring the Job Market</b><small>Career Deep Dive</small>
      </button>
    </div>
  </div>
</header>
<main>
  <div class="loading" id="loading">Loading</div>
</main>
<script>
(function(){
  var tabs = Array.prototype.slice.call(document.querySelectorAll('[role=tab]'));
  var main = document.querySelector('main');
  var loading = document.getElementById('loading');
  var frames = {};
  var BY_FILE = {};
  tabs.forEach(function(t){ BY_FILE[t.dataset.src] = t.dataset.key; });

  // Address format: hub.html#map or hub.html#map/graphic-designer (the part after the slash goes to that page).
  function parse(hash){
    var h = (hash || '').replace(/^#/, '');
    var i = h.indexOf('/');
    var key = i < 0 ? h : h.slice(0, i);
    var sub = i < 0 ? '' : h.slice(i + 1);
    var ok = tabs.some(function(t){ return t.dataset.key === key; });
    return ok ? {key:key, sub:sub} : {key:tabs[0].dataset.key, sub:''};
  }
  function tabFor(key){ return tabs.filter(function(t){ return t.dataset.key === key; })[0]; }

  var subs = {};      // where each tab was last (a Career Map job, a magazine section)
  var current = null;

  function setHash(key, sub, push){
    var hash = '#' + key + (sub ? '/' + sub : '');
    if(location.hash === hash) return;
    try{ history[push ? 'pushState' : 'replaceState'](null, '', hash); }catch(e){}
  }

  // Runs each time a page loads in its tab.
  function hookFrame(key, f){
    var w, doc;
    try{ w = f.contentWindow; doc = f.contentDocument; }catch(e){ return; }
    if(!w || !doc) return;

    // Keep the hub's address in step with the page, so a copied link opens the same job or section.
    function sync(){
      var s = '';
      try{ s = decodeURIComponent((w.location.hash || '').replace(/^#/, '')); }catch(e){}
      subs[key] = s;
      if(current === key) setHash(key, s, false);
    }
    ['pushState', 'replaceState'].forEach(function(m){
      var orig = w.history[m];
      w.history[m] = function(){ var r = orig.apply(this, arguments); sync(); return r; };
    });
    w.addEventListener('hashchange', sync);
    sync();

    // Links that point at one of the other pages switch tabs instead of loading inside this one.
    doc.addEventListener('click', function(e){
      if(e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      var a = e.target.closest && e.target.closest('a[href]');
      if(!a || (a.target && a.target !== '_self')) return;
      var u;
      try{ u = new URL(a.getAttribute('href'), w.location.href); }catch(err){ return; }
      if(u.origin !== location.origin) return;
      var file = u.pathname.split('/').pop() || 'index.html';
      var to = BY_FILE[file];
      if(!to || to === key) return;
      e.preventDefault();
      show(to, u.hash.replace(/^#/, '') || null, true);
    });
  }

  // sub: a spot inside the page to open, or null to leave the page where the student left it.
  function frameFor(key, sub){
    var t = tabFor(key);
    var src = t.dataset.src + (sub ? '#' + encodeURIComponent(sub) : '');
    var f = frames[key];
    if(!f){
      f = document.createElement('iframe');
      f.id = 'panel-' + key;
      f.setAttribute('role', 'tabpanel');
      f.setAttribute('aria-labelledby', t.id);
      f.title = t.querySelector('small').textContent;
      f.addEventListener('load', function(){ if(!f.hidden) loading.hidden = true; hookFrame(key, f); });
      f.src = src;
      main.appendChild(f);
      frames[key] = f;
      subs[key] = sub || '';
    } else if(sub && sub !== subs[key]){
      // The pages read their address when they start, so reload the page at the requested spot.
      subs[key] = sub;
      try{ f.contentWindow.location.replace(src); f.contentWindow.location.reload(); }catch(e){ f.src = src; }
    }
    return f;
  }

  function show(key, sub, push){
    var f = frameFor(key, sub);
    current = key;
    tabs.forEach(function(t){
      var on = t.dataset.key === key;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
    });
    Object.keys(frames).forEach(function(k){ frames[k].hidden = k !== key; });
    loading.hidden = !!(f.contentDocument && f.contentDocument.readyState === 'complete');
    setHash(key, subs[key] || '', push);
    document.title = tabFor(key).querySelector('small').textContent + ' · COMD Career Tools';
  }

  tabs.forEach(function(t, i){
    t.addEventListener('click', function(){ show(t.dataset.key, null, true); });
    t.addEventListener('keydown', function(e){
      var n = {ArrowRight:1, ArrowLeft:-1}[e.key];
      var to = null;
      if(n) to = tabs[(i + n + tabs.length) % tabs.length];
      if(e.key === 'Home') to = tabs[0];
      if(e.key === 'End') to = tabs[tabs.length - 1];
      if(!to) return;
      e.preventDefault();
      to.focus();
      show(to.dataset.key, null, true);
    });
  });

  window.addEventListener('popstate', function(){ var p = parse(location.hash); show(p.key, p.sub || null, false); });
  var p = parse(location.hash);
  show(p.key, p.sub || null, false);
})();
</script>
</body>
</html>
