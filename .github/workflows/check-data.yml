name: Check data files

on:
  pull_request:
    paths:
      - "data/**"
      - "index.html"
      - "career-map.html"
      - "career-magazine.html"
      - "hub.html"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "index.html"
      - "career-map.html"
      - "career-magazine.html"
      - "hub.html"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the data files are valid
        run: |
          python3 - <<'PY'
          import json, sys
          ok = True
          for path in ["data/role-content.json", "data/job-data.json", "data/career-map.json"]:
              try:
                  data = json.load(open(path, encoding="utf-8"))
              except json.JSONDecodeError as e:
                  print(f"::error file={path},line={e.lineno}::Formatting problem on line {e.lineno}: {e.msg}. Check for a missing comma or quote mark.")
                  ok = False
                  continue
              if path.endswith("role-content.json"):
                  fields = {"dayToDay": str, "whyThisJob": str, "searchTerms": list, "nycEmployers": list, "portfolioPieces": list}
                  for job in ["gd", "ad", "cw", "mo", "il", "ux", "fe", "ve", "cp"]:
                      if job not in data:
                          print(f"::error file={path}::The job '{job}' is missing.")
                          ok = False
                          continue
                      for name, kind in fields.items():
                          if not isinstance(data[job].get(name), kind):
                              print(f"::error file={path}::'{job}' → '{name}' should be {'text in quotes' if kind is str else 'a list like [\"a\", \"b\"]'}.")
                              ok = False
              if path.endswith("career-map.json"):
                  roles = json.load(open("data/role-content.json", encoding="utf-8"))
                  paths = {p["id"] for p in data.get("paths", [])}
                  courses = {c["code"]: c for c in data.get("courses", [])}
                  for c in courses.values():
                      if c.get("type") not in ("strategy", "skills"):
                          print(f"::error file={path}::COMD {c['code']}: 'type' should be \"strategy\" or \"skills\".")
                          ok = False
                      for p in c.get("paths", []):
                          if p not in paths:
                              print(f"::error file={path}::COMD {c['code']} lists a line '{p}' that doesn't exist.")
                              ok = False
                  for job in data.get("jobs", []):
                      name = job.get("title", job.get("id", "?"))
                      if job.get("path") not in paths:
                          print(f"::error file={path}::'{name}' is on a line that doesn't exist.")
                          ok = False
                      if job.get("role") not in roles:
                          print(f"::error file={path}::'{name}' links to Path Finder job '{job.get('role')}', which doesn't exist.")
                          ok = False
                      for kind, need in (("strategy", 3), ("skills", 4)):
                          picks = job.get(kind, [])
                          if len(picks) != need:
                              print(f"::error file={path}::'{name}' needs exactly {need} {kind} courses. It has {len(picks)}.")
                              ok = False
                          for code in picks:
                              c = courses.get(code)
                              if not c:
                                  print(f"::error file={path}::'{name}' recommends COMD {code}, which isn't in the course list.")
                                  ok = False
                              elif c["type"] != kind:
                                  print(f"::error file={path}::'{name}' lists COMD {code} as {kind}, but it's a {c['type']} course.")
                                  ok = False
                              elif not c.get("offered"):
                                  print(f"::error file={path}::'{name}' recommends COMD {code}, which is marked as not offered.")
                                  ok = False
          import re
          cm = json.load(open("data/career-map.json", encoding="utf-8"))
          retired = set(cm.get("retired", []))
          files = ["index.html", "career-map.html", "career-magazine.html", "hub.html", "data/career-map.json", "data/role-content.json"]
          for f in files:
              text = open(f, encoding="utf-8").read()
              if f == "data/career-map.json":
                  text = text.replace(json.dumps(cm.get("retired", [])), "")
                  text = re.sub(r'"retired":\s*\[[^\]]*\]', "", text)
              for code in sorted(retired):
                  if re.search(r"(?<!\d)" + code + r"(?!\d)", text):
                      print(f"::error file={f}::COMD {code} is retired but still appears here. Remove it.")
                      ok = False
          idx = open("index.html", encoding="utf-8").read()
          pf = {m.group(1) for m in re.finditer(r"\['(\d{4})','[^']*','(?:strat|skill)'", idx)}
          mp = {c["code"] for c in cm.get("courses", [])}
          for code in sorted(pf - mp):
              print(f"::error file=data/career-map.json::COMD {code} is in the Path Finder (index.html) but not in the Career Map course list.")
              ok = False
          for code in sorted(mp - pf):
              print(f"::error file=index.html::COMD {code} is in the Career Map course list but not in the Path Finder (index.html).")
              ok = False
          off_map = {c["code"] for c in cm.get("courses", []) if not c.get("offered")}
          m = re.search(r"var OFF = \[([^\]]*)\]", idx)
          off_pf = set(re.findall(r"\d{4}", m.group(1))) if m else set()
          if off_pf != off_map:
              print(f"::error file=index.html::Not-offered courses differ. Path Finder OFF list: {sorted(off_pf)}. Career Map 'offered': false: {sorted(off_map)}.")
              ok = False
          mag = open("career-magazine.html", encoding="utf-8").read()
          for code in sorted(off_map):
              if re.search(r"(?<!\d)" + code + r"(?!\d)", mag):
                  print(f"::error file=career-magazine.html::COMD {code} hasn't been offered recently, so the magazine shouldn't recommend it.")
                  ok = False
          print("All data files look good." if ok else "Fix the problems above, then commit again.")
          sys.exit(0 if ok else 1)
          PY
